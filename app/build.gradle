plugins { id 'com.android.application' }

android {
    namespace 'com.medtimer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.medtimer.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    signingConfigs {
        release {
            storeFile file('medtimer.jks')
            storePassword 'medtimer'
            keyAlias 'medtimer'
            keyPassword 'medtimer'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
