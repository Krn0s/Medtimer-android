name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MedTimer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedTimer
          path: MedTimer.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MedTimer.apk --title "MedTimer — latest build" --notes "On your phone: tap MedTimer.apk to download, then open it to install."
